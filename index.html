<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Esteban: Cuenta Regresiva</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;min-height:100vh;background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.55)),url('bariloche.jpg');background-size:cover;background-position:center;display:flex;justify-content:center;align-items:center;color:#fff}
.card{width:95%;max-width:1000px;background:rgba(0,0,0,.35);backdrop-filter:blur(12px);border-radius:25px;padding:40px;text-align:center;border:1px solid rgba(255,255,255,.15)}
h1{font-size:3rem;margin-bottom:10px;text-shadow:2px 2px 8px rgba(0,0,0,.8)}
.subtitulo{font-size:1.2rem;margin-bottom:25px;color:#dbeafe}
.info{margin:10px 0;font-size:1.1rem}.contador{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;margin-top:30px}.box{width:150px;background:rgba(255,255,255,.15);border-radius:20px;padding:20px}.valor{font-size:4rem;font-weight:bold;color:#38bdf8}.label{margin-top:10px}.resumen{margin-top:25px;font-size:1.3rem;font-weight:bold;color:#4ade80}@media(max-width:768px){h1{font-size:2rem}.box{width:120px}.valor{font-size:3rem}}
</style>
</head>
<body>
<div class="card">
<h1>🎿 Esteban: Cuenta Regresiva</h1>
<div class="subtitulo">Bariloche te espera...</div>
<div id="fechaActual" class="info"></div>
<div id="fechaObjetivo" class="info"></div>
<div class="contador">
<div class="box"><div id="dias" class="valor">0</div><div class="label">Días</div></div>
<div class="box"><div id="horas" class="valor">0</div><div class="label">Horas</div></div>
<div class="box"><div id="minutos" class="valor">0</div><div class="label">Minutos</div></div>
<div class="box"><div id="segundos" class="valor">0</div><div class="label">Segundos</div></div>
</div>
<div id="resumen" class="resumen"></div>
</div>
<script>
function obtenerObjetivo(){const ahora=new Date();let objetivo=new Date(ahora.getFullYear(),7,20,7,0,0);if(objetivo<=ahora){objetivo.setFullYear(ahora.getFullYear()+1)}return objetivo}
function actualizar(){const ahora=new Date();const objetivo=obtenerObjetivo();const diferencia=objetivo.getTime()-ahora.getTime();const dias=Math.floor(diferencia/86400000);const horas=Math.floor((diferencia%86400000)/3600000);const minutos=Math.floor((diferencia%3600000)/60000);const segundos=Math.floor((diferencia%60000)/1000);document.getElementById('fechaActual').innerHTML='📅 Fecha actual: <b>'+ahora.toLocaleString('es-AR')+'</b>';document.getElementById('fechaObjetivo').innerHTML='🎯 Objetivo: <b>'+objetivo.toLocaleString('es-AR')+'</b>';document.getElementById('dias').innerText=dias;document.getElementById('horas').innerText=horas;document.getElementById('minutos').innerText=minutos;document.getElementById('segundos').innerText=segundos;document.getElementById('resumen').innerHTML=`Faltan ${dias} días, ${horas} horas, ${minutos} minutos y ${segundos} segundos`;}
actualizar();setInterval(actualizar,1000);
</script>
</body>
</html>
