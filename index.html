<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cuenta Regresiva</title><style>body{margin:0;background:#0f172a;color:#fff;font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}.card{width:100%;max-width:900px;background:#1e293b;border-radius:20px;padding:25px;text-align:center}.contador{display:flex;flex-wrap:wrap;justify-content:center;gap:15px;margin-top:25px}.box{background:#334155;min-width:120px;padding:15px;border-radius:12px}.valor{font-size:48px;font-weight:bold;color:#38bdf8}.info{margin-top:15px;font-size:18px}.resumen{margin-top:25px;font-size:20px;color:#4ade80}</style></head><body><div class='card'><h1>Cuenta Regresiva</h1><div id='fechaActual' class='info'></div><div id='fechaObjetivo' class='info'></div><div class='contador'><div class='box'><div id='dias' class='valor'>0</div><div>Días</div></div><div class='box'><div id='horas' class='valor'>0</div><div>Horas</div></div><div class='box'><div id='minutos' class='valor'>0</div><div>Minutos</div></div><div class='box'><div id='segundos' class='valor'>0</div><div>Segundos</div></div></div><div id='resumen' class='resumen'></div></div><script>function obtenerObjetivo(){const ahora=new Date();let objetivo=new Date(ahora.getFullYear(),7,20,7,0,0);if(objetivo<=ahora){objetivo.setFullYear(ahora.getFullYear()+1)}return objetivo}function actualizar(){const ahora=new Date();const objetivo=obtenerObjetivo();const d=objetivo.getTime()-ahora.getTime();const dias=Math.floor(d/86400000);const horas=Math.floor((d%86400000)/3600000);const minutos=Math.floor((d%3600000)/60000);const segundos=Math.floor((d%60000)/1000);document.getElementById('fechaActual').innerHTML='<b>Fecha actual:</b> '+ahora.toLocaleString();document.getElementById('fechaObjetivo').innerHTML='<b>Fecha objetivo:</b> '+objetivo.toLocaleString();document.getElementById('dias').textContent=dias;document.getElementById('horas').textContent=horas;document.getElementById('minutos').textContent=minutos;document.getElementById('segundos').textContent=segundos;document.getElementById('resumen').innerHTML='Faltan '+dias+' días, '+horas+' horas, '+minutos+' minutos y '+segundos+' segundos';}actualizar();setInterval(actualizar,1000);</script></body></html>
